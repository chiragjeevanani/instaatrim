# Instaatrim Production Enterprise Reverse Proxy & Failover
# Fulfills:
# 1. Multi-instance API behind Nginx least-conn
# 2. Automatic failover on 502/503/504 errors

upstream instaatrim_backend_cluster {
    least_conn; # Load balances requests to the instance with the least active connections
    server 127.0.0.1:6200 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:6201 max_fails=3 fail_timeout=10s backup; # Standby failover instance
}

server {
    listen 80;
    server_name api.instaatrim.com;

    # Automatic Failover handling
    proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 10s;

    location / {
        proxy_pass http://instaatrim_backend_cluster;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Request Tracing and client IP forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
